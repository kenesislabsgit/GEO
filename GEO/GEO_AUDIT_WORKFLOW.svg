<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1840" viewBox="0 0 1200 1840" role="img" aria-labelledby="title description">
  <title id="title">GEO Audit Workflow</title>
  <desc id="description">A flow diagram showing the GEO audit process from website URL to final report and dashboard data.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f8ff"/>
      <stop offset="100%" stop-color="#eef8f3"/>
    </linearGradient>

    <linearGradient id="startGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#163b65"/>
      <stop offset="100%" stop-color="#2469a0"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#16324f" flood-opacity="0.16"/>
    </filter>

    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2878b5"/>
    </marker>

    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#d64545"/>
    </marker>

    <style>
      .title { font: 700 44px Arial, sans-serif; fill: #12355b; }
      .subtitle { font: 400 19px Arial, sans-serif; fill: #52677a; }
      .box-title { font: 700 22px Arial, sans-serif; fill: #12314b; }
      .box-small { font: 400 17px Arial, sans-serif; fill: #496275; }
      .white-title { font: 700 24px Arial, sans-serif; fill: white; }
      .white-small { font: 400 17px Arial, sans-serif; fill: #eaf5ff; }
      .decision { font: 700 20px Arial, sans-serif; fill: #624b00; }
      .stop-title { font: 700 20px Arial, sans-serif; fill: #8d1d1d; }
      .arrow-label { font: 700 16px Arial, sans-serif; fill: #2878b5; }
      .no-label { font: 700 16px Arial, sans-serif; fill: #c83434; }
      .section-label { font: 700 16px Arial, sans-serif; letter-spacing: 2px; fill: #668094; }
      .flow { fill: none; stroke: #2878b5; stroke-width: 4; marker-end: url(#arrowBlue); }
      .stop-flow { fill: none; stroke: #d64545; stroke-width: 4; stroke-dasharray: 8 7; marker-end: url(#arrowRed); }
      .process-box { fill: #ffffff; stroke: #3b82b8; stroke-width: 2.5; }
      .output-box { fill: #eaf8ef; stroke: #30915a; stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="1200" height="1840" fill="url(#background)"/>
  <rect x="35" y="35" width="1130" height="1770" rx="30" fill="#ffffff" opacity="0.72" stroke="#d8e6f0" stroke-width="2"/>

  <text x="600" y="95" text-anchor="middle" class="title">GEO AUDIT WORKFLOW</text>
  <text x="600" y="130" text-anchor="middle" class="subtitle">How a website becomes an AI recommendation audit</text>

  <!-- Start -->
  <rect x="375" y="170" width="450" height="90" rx="45" fill="url(#startGradient)" filter="url(#shadow)"/>
  <text x="600" y="207" text-anchor="middle" class="white-title">START AUDIT</text>
  <text x="600" y="235" text-anchor="middle" class="white-small">Enter the company website URL</text>

  <path d="M600 260 L600 305" class="flow"/>

  <!-- Website understanding -->
  <text x="115" y="305" class="section-label">UNDERSTAND THE COMPANY</text>

  <rect x="350" y="320" width="500" height="90" rx="16" class="process-box" filter="url(#shadow)"/>
  <circle cx="400" cy="365" r="25" fill="#2878b5"/>
  <text x="400" y="373" text-anchor="middle" class="white-title">1</text>
  <text x="445" y="357" class="box-title">Read the Website</text>
  <text x="445" y="385" class="box-small">Collect useful pages and content</text>

  <path d="M600 410 L600 455" class="flow"/>

  <polygon points="600,455 735,515 600,575 465,515" fill="#fff4cc" stroke="#d7a900" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="600" y="508" text-anchor="middle" class="decision">Useful pages</text>
  <text x="600" y="533" text-anchor="middle" class="decision">found?</text>

  <path d="M465 515 L255 515" class="stop-flow"/>
  <text x="350" y="500" text-anchor="middle" class="no-label">NO</text>
  <rect x="75" y="470" width="180" height="90" rx="16" fill="#ffe8e8" stroke="#d64545" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="165" y="508" text-anchor="middle" class="stop-title">STOP AUDIT</text>
  <text x="165" y="536" text-anchor="middle" class="box-small">No useful pages</text>

  <path d="M600 575 L600 620" class="flow"/>
  <text x="625" y="606" class="arrow-label">YES</text>

  <rect x="350" y="635" width="500" height="90" rx="16" class="process-box" filter="url(#shadow)"/>
  <circle cx="400" cy="680" r="25" fill="#2878b5"/>
  <text x="400" y="688" text-anchor="middle" class="white-title">2</text>
  <text x="445" y="672" class="box-title">Extract Website Facts</text>
  <text x="445" y="700" class="box-small">Find pricing, proof, FAQs, docs, and more</text>

  <path d="M600 725 L600 770" class="flow"/>

  <rect x="350" y="785" width="500" height="90" rx="16" class="process-box" filter="url(#shadow)"/>
  <circle cx="400" cy="830" r="25" fill="#2878b5"/>
  <text x="400" y="838" text-anchor="middle" class="white-title">3</text>
  <text x="445" y="822" class="box-title">Build Company Profile</text>
  <text x="445" y="850" class="box-small">Understand buyers, services, and market</text>

  <path d="M600 875 L600 920" class="flow"/>

  <polygon points="600,920 735,980 600,1040 465,980" fill="#fff4cc" stroke="#d7a900" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="600" y="973" text-anchor="middle" class="decision">Enough company</text>
  <text x="600" y="998" text-anchor="middle" class="decision">details?</text>

  <path d="M735 980 L945 980" class="stop-flow"/>
  <text x="845" y="965" text-anchor="middle" class="no-label">NO</text>
  <rect x="945" y="935" width="180" height="90" rx="16" fill="#ffe8e8" stroke="#d64545" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1035" y="973" text-anchor="middle" class="stop-title">STOP AUDIT</text>
  <text x="1035" y="1001" text-anchor="middle" class="box-small">Profile too weak</text>

  <path d="M600 1040 L600 1085" class="flow"/>
  <text x="625" y="1071" class="arrow-label">YES</text>

  <!-- Measure -->
  <text x="115" y="1095" class="section-label">MEASURE AI RECOMMENDATIONS</text>

  <rect x="100" y="1120" width="300" height="100" rx="16" class="process-box" filter="url(#shadow)"/>
  <circle cx="145" cy="1170" r="25" fill="#2878b5"/>
  <text x="145" y="1178" text-anchor="middle" class="white-title">4</text>
  <text x="185" y="1162" class="box-title">Create Buyer</text>
  <text x="185" y="1188" class="box-title">Questions</text>

  <path d="M400 1170 L450 1170" class="flow"/>

  <rect x="465" y="1120" width="270" height="100" rx="16" class="process-box" filter="url(#shadow)"/>
  <circle cx="510" cy="1170" r="25" fill="#2878b5"/>
  <text x="510" y="1178" text-anchor="middle" class="white-title">5</text>
  <text x="550" y="1162" class="box-title">Ask AI</text>
  <text x="550" y="1188" class="box-title">Assistants</text>

  <path d="M735 1170 L785 1170" class="flow"/>

  <rect x="800" y="1120" width="300" height="100" rx="16" class="process-box" filter="url(#shadow)"/>
  <circle cx="845" cy="1170" r="25" fill="#2878b5"/>
  <text x="845" y="1178" text-anchor="middle" class="white-title">6</text>
  <text x="885" y="1162" class="box-title">Count</text>
  <text x="885" y="1188" class="box-title">Recommendations</text>

  <path d="M950 1220 L950 1260 L335 1260 L335 1300" class="flow"/>
  <path d="M950 1220 L950 1300" class="flow"/>

  <!-- Verify and compare -->
  <text x="115" y="1295" class="section-label">VERIFY AND COMPARE</text>

  <rect x="150" y="1315" width="370" height="95" rx="16" class="process-box" filter="url(#shadow)"/>
  <circle cx="200" cy="1362" r="25" fill="#2878b5"/>
  <text x="200" y="1370" text-anchor="middle" class="white-title">7</text>
  <text x="245" y="1354" class="box-title">Check Web Presence</text>
  <text x="245" y="1382" class="box-small">Verify company mentions</text>

  <rect x="680" y="1315" width="370" height="95" rx="16" class="process-box" filter="url(#shadow)"/>
  <circle cx="730" cy="1362" r="25" fill="#2878b5"/>
  <text x="730" y="1370" text-anchor="middle" class="white-title">8</text>
  <text x="775" y="1354" class="box-title">Check Competitors</text>
  <text x="775" y="1382" class="box-small">Verify competitor websites</text>

  <path d="M335 1410 L335 1450 L600 1450 L600 1480" class="flow"/>
  <path d="M865 1410 L865 1450 L600 1450" class="flow"/>

  <rect x="350" y="1495" width="500" height="90" rx="16" class="process-box" filter="url(#shadow)"/>
  <circle cx="400" cy="1540" r="25" fill="#2878b5"/>
  <text x="400" y="1548" text-anchor="middle" class="white-title">9</text>
  <text x="445" y="1532" class="box-title">Compare Company and Competitors</text>
  <text x="445" y="1560" class="box-small">Find important gaps</text>

  <path d="M600 1585 L600 1620" class="flow"/>

  <!-- Final actions -->
  <rect x="140" y="1635" width="400" height="90" rx="16" class="process-box" filter="url(#shadow)"/>
  <circle cx="190" cy="1680" r="25" fill="#2878b5"/>
  <text x="190" y="1688" text-anchor="middle" class="white-title">10</text>
  <text x="235" y="1672" class="box-title">Create Improvement List</text>
  <text x="235" y="1700" class="box-small">Explain what to fix</text>

  <path d="M540 1680 L660 1680" class="flow"/>

  <rect x="675" y="1635" width="385" height="90" rx="16" class="process-box" filter="url(#shadow)"/>
  <circle cx="725" cy="1680" r="25" fill="#2878b5"/>
  <text x="725" y="1688" text-anchor="middle" class="white-title">11</text>
  <text x="770" y="1672" class="box-title">Check Data Quality</text>
  <text x="770" y="1700" class="box-small">Add confidence and warnings</text>

  <path d="M868 1725 L868 1760 L375 1760 L375 1780" class="flow"/>
  <path d="M868 1725 L868 1780" class="flow"/>

  <rect x="190" y="1780" width="370" height="45" rx="20" class="output-box"/>
  <text x="375" y="1810" text-anchor="middle" class="box-title">FINAL REPORT</text>

  <rect x="680" y="1780" width="370" height="45" rx="20" class="output-box"/>
  <text x="865" y="1810" text-anchor="middle" class="box-title">DASHBOARD DATA</text>
</svg>
